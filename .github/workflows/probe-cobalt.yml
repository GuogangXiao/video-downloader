name: Probe Cobalt Instances

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe cobalt instances
        run: |
          INSTANCES="co.wuk.sh api.cobalt.best cobalt-api.kwiatekmiki.com dl01.cobalt-experiments.eu dl02.cobalt-experiments.eu cobalt.255x.de cobalt-api.nyc.railway.app cobalt.y2m.workers.dev cobalt-backend.canine.tools capi.oak.li cobalt-api.ayo.tf api.dl.ktun.dev"
          for inst in $INSTANCES; do
            result=$(curl -s --max-time 15 -X POST "https://$inst" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d '{"url":"https://www.youtube.com/watch?v=jNQXAC9IVRw"}' 2>&1 || echo "CURL_FAIL_$?")
            echo "=== $inst ==="
            echo "$result" | head -c 300
            echo ""
          done
