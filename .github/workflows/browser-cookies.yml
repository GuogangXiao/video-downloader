name: Refresh YouTube Cookies

on:
  workflow_dispatch:

jobs:
  get-cookies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          pip install playwright pynacl
          python -m playwright install --with-deps chromium

      - name: Fetch YouTube cookies
        run: |
          python - <<'PYEOF'
          import json
          from playwright.sync_api import sync_playwright

          ua = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-blink-features=AutomationControlled"])
              ctx = browser.new_context(
                  user_agent=ua,
                  locale="en-US",
                  viewport={"width": 1280, "height": 720},
              )
              page = ctx.new_page()
              try:
                  page.goto("https://www.youtube.com/", wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(10000)
              except Exception as e:
                  print("WARN: 页面导航异常:", e)
              cookies = ctx.cookies()
              browser.close()

          if not cookies:
              raise SystemExit("未获取到任何 cookie")

          lines = ["# Netscape HTTP Cookie File", "# HttpOnly_", ""]
          for c in cookies:
              domain = c["domain"].lstrip(".")
              secure = "TRUE" if c.get("secure") else "FALSE"
              exp = int(c.get("expires", 0)) or 0
              lines.append(f"{domain}\tTRUE\t{c['path']}\t{secure}\t{exp}\t{c['name']}\t{c['value']}")
          cookie_text = "\n".join(lines)
          with open("cookies.txt", "w", encoding="utf-8") as f:
              f.write(cookie_text)

          print(f"OK: 获取到 {len(cookies)} 个 cookie，已生成 cookies.txt")
          names = [c["name"] for c in cookies]
          print("关键 cookie 存在:", [k for k in ["VISITOR_INFO1_LIVE", "__Secure-YEC", "CONSENT"] if k in names])
          PYEOF

      - name: Save cookies to repo secrets
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYEOF'
          import base64, json, os, urllib.request
          from nacl import encoding, public

          token = os.environ["PAT_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}

          with open("cookies.txt", "r", encoding="utf-8") as f:
              cookie_text = f.read()

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers)
          with urllib.request.urlopen(req) as r:
              pk_data = json.load(r)

          pk = public.PublicKey(pk_data["key"].encode(), encoding.Base64Encoder())
          encrypted = public.SealedBox(pk).encrypt(cookie_text.encode())
          enc_b64 = base64.b64encode(encrypted).decode()

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/YTDLP_COOKIES",
              data=json.dumps({"encrypted_value": enc_b64, "key_id": pk_data["key_id"]}).encode(),
              headers=headers, method="PUT")
          with urllib.request.urlopen(req) as r:
              print(f"OK: YTDLP_COOKIES 已写入仓库 Secrets (HTTP {r.status})")
          PYEOF
